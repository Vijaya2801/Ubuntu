name: Deploy Docker Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # GitHub provides this runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure SSH access to EC2
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is empty"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER secret is empty"
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is empty"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "Checking SSH host: $EC2_HOST"
          ssh-keyscan -v -T 10 -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts 2> ~/ssh-keyscan-error.log || {
              cat ~/ssh-keyscan-error.log
              echo "ERROR: Cannot retrieve SSH host key."
              exit 1
            }


      # Step 3: Connect to EC2 and deploy the container
      - name: Pull and Run Docker Container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e
             docker pull nginx:alpine
             docker rm -f nginx-demo 2>/dev/null || true
             docker run -d \
               --name nginx-demo \
               --restart unless-stopped \
               -p 8081:80 \
               nginx:alpine
             docker ps'
