
name: Deploy Docker Container to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure SSH
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          # Validate secrets
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is empty"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER secret is empty"
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is empty"
            exit 1
          fi

          # Create SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Test SSH port connectivity
          echo "Testing SSH connectivity..."
          nc -vz -w 10 "$EC2_HOST" 22

          # Add EC2 host key
          echo "Retrieving SSH host key..."
          ssh-keyscan -T 10 -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # Step 3: Test SSH login
      - name: Test EC2 SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH connection successful"'

      # Step 4: Install Docker if missing and deploy NGINX
      - name: Deploy Docker Container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            'set -e

             if ! command -v docker >/dev/null 2>&1; then
               echo "Installing Docker..."
               sudo dnf install -y docker
             fi

             sudo systemctl enable --now docker

             echo "Pulling NGINX image..."
             sudo docker pull nginx:alpine

             echo "Removing old container if present..."
             sudo docker rm -f nginx-demo 2>/dev/null || true

             echo "Starting NGINX container..."
             sudo docker run -d \
               --name nginx-demo \
               --restart unless-stopped \
               -p 8081:80 \
               nginx:alpine

             echo "Checking running containers..."
             sudo docker ps

             echo "Deployment completed successfully."'
